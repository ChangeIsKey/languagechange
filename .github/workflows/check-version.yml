name: Check version

on:
  push:
    branches:
      - main
      - ci/automatic-releases
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      version: ${{ steps.compare.outputs.version }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Show current version
        run: |
          python -c "import tomllib; print('Current version:', tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
      
      - name: Show previous version
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          git show "$BEFORE:pyproject.toml" | python -c "import sys, tomllib; print('Previous version:', tomllib.loads(sys.stdin.read())['project']['version'])"   
       
      - name: Compare versions
        id: compare
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          git show "${BEFORE}:pyproject.toml" > /tmp/previous-pyproject.toml
          python -c "
          import tomllib
          with open('/tmp/previous-pyproject.toml', 'rb') as f:
              previous = tomllib.load(f)['project']['version']
          with open('pyproject.toml', 'rb') as f:
              current = tomllib.load(f)['project']['version']
          print(f'Previous version: {previous}')
          print(f'Current version: {current}')
          print('Version changed:', previous != current)
          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'changed={str(previous != current).lower()}', file=output)
              print(f'version={current}', file=output)
          "
            
      - name: Report a version change
        if: steps.compare.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.compare.outputs.version }}
        run: echo "Version $VERSION would be considered for release." 
        
      - name: Install test dependencies
        if: steps.compare.outputs.changed == 'true'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install .
          python -m pip install pytest
          wget https://spraakbanken.gu.se/resurser/meningsmangder/svt-2004.xml.bz2
          test -f svt-2004.xml.bz2

      - name: Run tests
        if: steps.compare.outputs.changed == 'true'
        run: pytest tests
      
      - name: Install build tool
        if: steps.compare.outputs.changed == 'true'
        run: python -m pip install build twine 

      - name: Build package
        if: steps.compare.outputs.changed == 'true'
        run: python -m build

      - name: Check built package
        if: steps.compare.outputs.changed == 'true'
        run: python -m twine check dist/*

      - name: Save package files
        if: steps.compare.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/ 

      - name: Preview release
        if: github.ref == 'refs/heads/main' && steps.compare.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.compare.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          echo "Would release version: $VERSION"
          echo "Source commit: $COMMIT"

  prepare-publish:
    needs: check-version
    if: github.ref == 'refs/heads/main' && needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download package files
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/

      - name: Show files ready for publishing
        run: ls -l dist/

  
      
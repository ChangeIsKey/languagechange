name: Check version

on:
  push:
    branches:
      - main
      - ci/automatic-releases
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Show current version
        run: |
          python -c "import tomllib; print('Current version:', tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
      
      - name: Show previous version
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          git show "$BEFORE:pyproject.toml" | python -c "import sys, tomllib; print('Previous version:', tomllib.loads(sys.stdin.read())['project']['version'])"   
       
      - name: Compare versions
        id: compare
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          git show "${BEFORE}:pyproject.toml" > /tmp/previous-pyproject.toml
          python -c "
          import tomllib
          with open('/tmp/previous-pyproject.toml', 'rb') as f:
              previous = tomllib.load(f)['project']['version']
          with open('pyproject.toml', 'rb') as f:
              current = tomllib.load(f)['project']['version']
          print(f'Previous version: {previous}')
          print(f'Current version: {current}')
          print('Version changed:', previous != current)
          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'changed={str(previous != current).lower()}', file=output)
          "
            
      - name: Report a version change
        if: steps.compare.outputs.changed == 'true'
        run: echo "The version changed. A release would be considered."  
        
      - name: Install test dependencies
        if: steps.compare.outputs.changed == 'true'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install .
          python -m pip install pytest
          wget https://spraakbanken.gu.se/resurser/meningsmangder/svt-2004.xml.bz2
          test -f svt-2004.xml.bz2

      - name: Run tests
        if: steps.compare.outputs.changed == 'true'
        run: pytest tests
      
      - name: Install build tool
        if: steps.compare.outputs.changed == 'true'
        run: python -m pip install build tomlkit

      - name: Add commit link to package metadata
        if: steps.compare.outputs.changed == 'true'
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python -c "
          import os
          from pathlib import Path
          import tomlkit

          path = Path('pyproject.toml')
          document = tomlkit.parse(path.read_text())
          url = f\"https://github.com/{os.environ['REPOSITORY']}/commit/{os.environ['SOURCE_COMMIT']}\"
          document['project']['urls']['Commit'] = url
          path.write_text(tomlkit.dumps(document))
          "

      - name: Build package
        if: steps.compare.outputs.changed == 'true'
        run: python -m build

      
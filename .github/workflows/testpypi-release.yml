name: TestPyPI release test

on:
  push:
    tags:
      - 'testpypi-v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install build twine tomlkit

      - name: Test release decisions offline
        run: python .github/scripts/test_release_flow.py

      - name: Set isolated test version
        id: version
        env:
          TEST_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          import tomlkit

          tag = os.environ['TEST_TAG']
          match = re.fullmatch(r'testpypi-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.dev([1-9][0-9]*)', tag)
          if not match:
              raise SystemExit('Expected a tag such as testpypi-v0.3.0.dev1')
          version = tag.removeprefix('testpypi-v')
          path = Path('pyproject.toml')
          document = tomlkit.parse(path.read_text())
          if document['project']['name'] != 'langchange':
              raise SystemExit('Unexpected package name')
          document['project']['version'] = version
          path.write_text(tomlkit.dumps(document))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)
          print(f'Building TestPyPI-only version {version}')
          PY

      - name: Install test dependencies
        run: |
          python -m pip install . pytest
          wget https://spraakbanken.gu.se/resurser/meningsmangder/svt-2004.xml.bz2
          test -f svt-2004.xml.bz2

      - name: Run project tests
        run: pytest tests

      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*
          python .github/scripts/check_distributions.py

      - name: Save test distributions
        uses: actions/upload-artifact@v4
        with:
          name: testpypi-distributions
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    needs: build
    runs-on: ubuntu-24.04
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download test distributions
        uses: actions/download-artifact@v4
        with:
          name: testpypi-distributions
          path: dist/

      - name: Publish to TestPyPI only
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-install:
    needs: [build, publish-testpypi]
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install test package without dependencies
        env:
          TEST_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m venv /tmp/langchange-test-install
          /tmp/langchange-test-install/bin/python -m pip install --no-cache-dir --no-deps --index-url https://test.pypi.org/simple/ "langchange==$TEST_VERSION"
          /tmp/langchange-test-install/bin/python -c "from importlib.metadata import version; import os; actual = version('langchange'); print('Installed version:', actual); assert actual == os.environ['TEST_VERSION']"
